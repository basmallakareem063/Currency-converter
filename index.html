<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Convert App</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Main CSS file -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1 class="text-center">Currency Converter Application</h1>

    <div class="card container">
      <form>
        <input
          type="number"
          name="num"
          id="amount"
          placeholder="Amount"
          class="form-input"
        />

        <label for="from" class="label-form">From</label>
        <select name="from" id="from"></select>

        <label for="to" class="label-form">To</label>
        <select name="to" id="to"></select>

        <button type="button" id="button">Convert</button>
      </form>

      <p class="result" id="result"></p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main JS file -->
    <script src="main.js"></script>
  </body>
</html>
